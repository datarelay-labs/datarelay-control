<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="datarelay-mark" x1="7" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!--
    DR Relay Monogram
    One continuous glyph reads as both D and R:
    - the rounded bowl establishes D
    - the shared bowl/stem plus outgoing lower-right leg establishes R
    - the small center cue communicates relay / data handoff
  -->
  <path
    fill="url(#datarelay-mark)"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="
      M7 8
      H27
      C42.2 8 52 17.1 52 31.4
      C52 39.6 48.5 46.0 42.0 50.0
      L58 56
      H43.2
      L32.8 43.7
      C31.0 44.0 29.0 44.2 27 44.2
      H18
      V56
      H7
      V8
      Z

      M18 18
      V34.2
      H27
      C35.5 34.2 41 30.5 41 24.9
      C41 20.5 36.6 18 27 18
      H18
      Z
    "
  />

  <!-- Relay / handoff cue. Deliberately simple so it survives favicon scale. -->
  <path
    d="M27 29H35V26L42 32L35 38V35H27Z"
    fill="#F8FAFC"
  />
</svg>
