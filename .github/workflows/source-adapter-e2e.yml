name: Source adapter E2E (optional)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/sources/**"
      - "app/runners/**"
      - "app/runtime/**"
      - "app/connectors/**"
      - "tests/test_source_adapter_e2e.py"
      - "tests/e2e_runtime_helpers.py"
      - "docker-compose.test.yml"
      - "docker/Dockerfile.minio-test"
      - "scripts/test/run-source-e2e-tests.sh"
      - "scripts/testing/**"
      - "requirements.txt"
      - ".github/workflows/source-adapter-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-adapter-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start fixtures, migrate, run source adapter E2E
        run: |
          chmod +x scripts/testing/*.sh scripts/test/*.sh scripts/testing/source-e2e/*.sh
          # Single source of truth: scripts/testing/_env.sh (postgres host port +
          # container prefix). Do not hardcode 55432 — that port is for GHA
          # services.postgres jobs, not docker-compose.test.yml postgres-test.
          ./scripts/test/run-source-e2e-tests.sh
      - name: Diagnose fixture stack on failure
        if: failure()
        run: |
          source scripts/testing/_env.sh
          echo "==> compose ps"
          docker compose -f docker-compose.test.yml ps || true
          echo "==> postgres-test logs"
          docker compose -f docker-compose.test.yml logs --tail 120 postgres-test || true
          echo "==> sftp-test logs"
          docker compose -f docker-compose.test.yml logs --tail 80 sftp-test || true
      - name: Validate compose file
        if: always()
        run: docker compose -f docker-compose.test.yml config >/dev/null
