    capture_supported: true
    continuous_safe: true
    rate_limit_strategy: local_unlimited
    free_or_trial: self_host_test_only
    account_lifetime: unlimited
    api_available: true
    seeded_data: true
    can_automate: true
    e2e_value: critical
    operational_burden: medium
