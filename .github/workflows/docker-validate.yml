name: Docker Compose validate

on:
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "deploy/**"
      - "docker/**"
      - "scripts/release/**"
      - ".github/workflows/docker-validate.yml"
  push:
    branches: [main, main-v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default compose
        run: docker compose -f docker-compose.yml config -q
      - name: Validate platform compose (production-style stack)
        run: docker compose -f docker-compose.platform.yml config -q
      - name: Validate HTTPS production-style compose
        # Production compose intentionally fail-closes without required secrets; supply
        # CI-only placeholders so `config` can validate interpolation/structure.
        env:
          POSTGRES_PASSWORD: ci-only-not-for-deploy
          JWT_SECRET_KEY: ci-only-not-for-deploy-jwt-secret-key-32b
          SECRET_KEY: ci-only-not-for-deploy-secret-key-32bytes
          ENCRYPTION_KEY: ci-only-not-for-deploy-encryption-key32
          GDC_PROXY_RELOAD_TOKEN: ci-only-not-for-deploy-token
        run: docker compose -f deploy/docker-compose.https.yml config -q

  shellcheck-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck release scripts
        # Fail on errors only; known SC21xx/SC2034/SC2016 warnings are intentional patterns.
        run: shellcheck -S error scripts/release/*.sh

  lightweight-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if PEM private key headers appear in tracked code paths
        run: |
          set -euo pipefail
          # Exclude unit-test fixtures and UI placeholder copy (not real key material).
          excludes=(
            ':(exclude)**/*.test.ts'
            ':(exclude)**/*.test.tsx'
            ':(exclude)**/test_*.py'
            ':(exclude)**/*_test.py'
            ':(exclude)frontend/src/components/connectors/remote-file-connector-fields.tsx'
          )
          if git grep -n "BEGIN RSA PRIVATE KEY" -- app tests scripts alembic frontend/src "${excludes[@]}" 2>/dev/null; then
            echo "::error::Possible RSA private key material in tracked sources"
            exit 1
          fi
          if git grep -n "BEGIN OPENSSH PRIVATE KEY" -- app tests scripts alembic frontend/src "${excludes[@]}" 2>/dev/null; then
            echo "::error::Possible OpenSSH private key material in tracked sources"
            exit 1
          fi
          echo "OK"
