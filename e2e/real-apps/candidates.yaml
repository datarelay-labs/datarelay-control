    credential_source: env:STRIPE_TEST_SECRET_KEY
    base_url: https://api.stripe.com
    seed_strategy: test_mode_fixtures_and_test_clocks
    capture_supported: true
    continuous_safe: false
    rate_limit_strategy: stripe_rate_limit_headers
    free_or_trial: test_mode_free
