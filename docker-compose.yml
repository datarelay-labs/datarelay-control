# Default local compose is the full development platform. This intentionally
# mirrors docker-compose.platform.yml so `docker compose up -d` cannot look
# successful with only PostgreSQL running.
services:
  postgres:
    extends:
      file: docker-compose.platform.yml
      service: postgres

  api:
    extends:
      file: docker-compose.platform.yml
      service: api

  gdc-wiremock-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-wiremock-test

  gdc-webhook-receiver-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-webhook-receiver-test

  gdc-syslog-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-syslog-test

  frontend:
    extends:
      file: docker-compose.platform.yml
      service: frontend

  reverse-proxy:
    extends:
      file: docker-compose.platform.yml
      service: reverse-proxy

volumes:
  gdc_platform_postgres_data:
  gdc_platform_tls:
  gdc_platform_nginx:

# Declared because extended platform services attach to these networks.
# gdc-dev-validation is external (created by lab/dev-validation compose stacks).
networks:
  default:
    name: gdc-platform_default
  gdc-dev-validation:
    external: true

secrets:
  npmrc:
    file: ${GDC_NPMRC_SECRET_FILE:-${HOME}/.npmrc}
