# Real Application E2E candidates (machine-readable).
# Credentials MUST come from environment / secret store — never commit secrets.
# Priority model: AUTH_COVERAGE | DATA_GENERATION | LONG_TERM_AVAILABILITY | AUTOMATION | OPERATIONAL_COST
# Prefer self-hosted real apps for deterministic auth coverage over popular SaaS-only choices.
# Status values: recommended | optional | defer | reject_for_now
# priority: P0 | P1 | P2

version: 2
updated: "2026-09-11"
credential_source: env
env_template: .env.real-apps.example
priority_model:
  dimensions:
    - AUTH_COVERAGE
    - DATA_GENERATION
    - LONG_TERM_AVAILABILITY
    - AUTOMATION
    - OPERATIONAL_COST
  notes: >
    Do not prioritize merely because a service is popular. Prefer self-hosted
    apps when they provide better deterministic auth/data coverage (e.g. Frappe
    session_login, WordPress Basic Auth). Mark product-unsupported OAuth
    Authorization Code / PKCE as NOT_IMPLEMENTED — never fake them.

defaults:
  capture_supported: true
  continuous_safe: false
  sanitize_before_commit: true
  live_validation_status_when_unconfigured: UNCONFIGURED

