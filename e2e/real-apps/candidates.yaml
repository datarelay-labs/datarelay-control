# Real Application E2E candidates (machine-readable).
# Credentials MUST come from environment / secret store — never commit secrets.
# Status values: recommended | optional | defer | reject_for_now

version: 1
updated: "2026-09-11"
credential_source: env
env_template: .env.real-apps.example

defaults:
  capture_supported: true
  continuous_safe: false
  sanitize_before_commit: true
  live_validation_status_when_unconfigured: UNCONFIGURED

candidates:
  - id: hubspot
    category: crm
    service: HubSpot
    enabled: false
    data_profile: [contacts, companies, deals, tickets]
    auth_type: oauth2_private_app_token
    credential_source: env:HUBSPOT_ACCESS_TOKEN
    base_url: https://api.hubapi.com
    seed_strategy: developer_test_account_sample_data
    capture_supported: true
    continuous_safe: false
    rate_limit_strategy: respect_retry_after_backoff
    free_or_trial: free_developer_test_accounts
    account_lifetime: test_accounts_up_to_10_enterprise_trial_features_90d
    api_available: true
    seeded_data: true
    can_automate: true
    e2e_value: high
    operational_burden: low
    recommendation: recommended
    notes: "Strong CRM general-data fit; private app token for automation."

  - id: shopify
    category: commerce
    service: Shopify
    enabled: false
    data_profile: [customers, products, orders, inventory]
    auth_type: oauth2_admin_api_access_token
    credential_source: env:SHOPIFY_ADMIN_ACCESS_TOKEN
    base_url: https://{shop}.myshopify.com/admin/api/{version}
    seed_strategy: partner_development_store
    capture_supported: true
    continuous_safe: false
    rate_limit_strategy: leaky_bucket_header_aware
    free_or_trial: partner_development_store_free
    account_lifetime: development_stores_persistent_while_partner_active
    api_available: true
    seeded_data: partial
    can_automate: true
    e2e_value: high
    operational_burden: medium
    recommendation: recommended
    notes: "Excellent commerce coverage; use development store only."

  - id: stripe
    category: finance
    service: Stripe
    enabled: false
    data_profile: [customers, invoices, subscriptions, payments, events]
