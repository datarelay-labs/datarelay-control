name: External runtime E2E (optional)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/sources/**"
      - "app/runners/**"
      - "app/runtime/**"
      - "app/delivery/**"
      - "tests/test_external_runtime_e2e.py"
      - "tests/e2e_runtime_helpers.py"
      - "docker-compose.test.yml"
      - "docker/Dockerfile.minio-test"
      - "scripts/test/run-external-runtime-e2e-tests.sh"
      - "scripts/testing/**"
      - "requirements.txt"
      - ".github/workflows/external-runtime-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start fixtures, migrate, run external runtime E2E
        run: |
          chmod +x scripts/testing/*.sh scripts/test/*.sh scripts/testing/source-e2e/*.sh
          # Runner sources scripts/testing/_env.sh in-process so compose container
          # prefix (gdc-smoke-*) and TEST_DATABASE_URL (55441) stay aligned for
          # pytest helpers (SOURCE_E2E_SFTP_CONTAINER). Do not split env across
          # separate GHA steps without writing GITHUB_ENV.
          ./scripts/test/run-external-runtime-e2e-tests.sh
      - name: Diagnose fixture stack on failure
        if: failure()
        run: |
          source scripts/testing/_env.sh
          echo "==> compose ps"
          docker compose -f docker-compose.test.yml ps || true
          echo "==> postgres-test logs"
          docker compose -f docker-compose.test.yml logs --tail 120 postgres-test || true
          echo "==> expected SFTP container: ${SOURCE_E2E_SFTP_CONTAINER}"
          docker ps -a --filter "name=sftp-test" --format '{{.Names}}\t{{.Status}}' || true
          docker compose -f docker-compose.test.yml logs --tail 80 sftp-test || true
      - name: Validate compose file
        if: always()
        run: docker compose -f docker-compose.test.yml config >/dev/null
