ecosystem: singer
identity:
  integration_name: tap-secret-bomb
  upstream_project: tap-secret-bomb
  vendor: Acme
  # Intentionally include a secret-looking value in a field that would land in package
license:
  identifier: MIT
auth:
  auth_type: bearer
  required_fields:
    - api_token
  # This hint must NOT be copied as a live secret into the package.
  # Package builder only uses field *names*, not values — tests also write a
  # poisoned fixture path separately.
proposed_source_type: HTTP_API_POLLING
mapping_status: MAPPED
streams:
  - name: items
    http_method: GET
    path: /v1/items
