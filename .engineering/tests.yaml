version: 1

paths:
  "frontend/**":
    domains: [frontend]
  "app/**":
    domains: [backend, runtime]
  "tests/**":
    domains: [backend]
  "alembic/**":
    domains: [persistence]
  "e2e/**":
    domains: [e2e]
  ".github/workflows/**":
    domains: [release]
  "docs/**":
    domains: [documentation]
  "specs/**":
    domains: [documentation]
  ".specify/**":
    domains: [documentation]
  "AGENTS.md":
    domains: [documentation]
  "README.md":
    domains: [documentation]
  "scripts/docs/**":
    domains: [documentation]

scenarios:
  - id: FRONTEND-BUILD-AFFECTED
    name: Frontend affected build
    level: static
    domains: [frontend]
    triggers: [affected, pr]
    platforms: [linux]
    command: "cd frontend && npm run build"
    invariants:
      - "Touched frontend code compiles and the production bundle builds."
    origin: "docs/testing/cursor-development-workflow.md"
    release_gate: true

  - id: BACKEND-FOCUSED-AFFECTED
    name: Backend focused affected tests
    level: integration
    cost: medium
    agent_default: true
    domains: [backend]
    triggers: [affected, pr]
    platforms: [linux]
    command: "./scripts/testing/run-focused-tests.sh"
    invariants:
      - "Affected backend behavior passes before broader qualification."
    origin: "docs/testing/cursor-development-workflow.md"
    release_gate: true

  - id: RUNTIME-E2E-SMOKE
    name: Runtime WireMock and PostgreSQL smoke
    level: e2e
    domains: [runtime, e2e]
    triggers: [rc, release]
    platforms: [linux, docker]
    command: "./scripts/testing/start-test-stack.sh && ./scripts/testing/run-smoke-tests.sh"
    invariants:
      - "Runtime/auth/mapping/delivery/checkpoint changes pass isolated smoke E2E."
      - "TEST_DATABASE_URL never targets production or shared operator databases."
    origin: "docs/testing/cursor-development-workflow.md"
    release_gate: true

  - id: BACKEND-FULL-RC
    name: Backend full qualification
    level: integration
    domains: [backend, persistence]
    triggers: [rc, release]
    platforms: [linux]
    command: "./scripts/test/run-backend-full.sh"
    invariants:
      - "Backend and migration behavior passes on the exact candidate source."
    origin: "README.md"
    release_gate: true

  - id: FRONTEND-VALIDATE-RC
    name: Frontend full validation
    level: component
    domains: [frontend]
    triggers: [rc, release]
    platforms: [linux]
    command: "cd frontend && npm run validate"
    invariants:
      - "Frontend unit tests, build, and lint pass on the exact candidate source."
    origin: "README.md"
    release_gate: true

  - id: E2E-FULL-REGRESSION
    name: Full platform regression
    level: e2e
    domains: [runtime, e2e]
    triggers: [rc, release]
    platforms: [linux, docker]
    command: "./scripts/testing/run-full-regression.sh"
    invariants:
      - "Full regression runs only after cheaper blocking checks pass."
    origin: "docs/testing/cursor-development-workflow.md"
    release_gate: true

  - id: DEV-VALIDATION-EPS-GUARDRAIL
    name: Dev Validation Lab and visible E2E throughput guardrail
    level: integration
    cost: medium
    agent_default: true
    domains: [runtime, e2e]
    triggers: [affected, pr]
    platforms: [linux]
    command: "python3 -m pytest -q tests/test_lab_throughput_config.py tests/test_dev_validation_lab.py tests/test_visible_e2e_seed.py"
    invariants:
      - "DEV VALIDATION and DEV E2E streams remain present and runtime-visible."
      - "Every configured validation/E2E stream remains within the 5-20 EPS target range."
      - "Validation changes do not silently reduce or inflate configured throughput outside the guardrail."
    origin: "Data Relay Control project invariant"
    release_gate: true

  - id: DOC-SOT-INTEGRITY
    name: Documentation Source-of-Truth integrity
    level: static
    domains: [documentation]
    triggers: [affected]
    platforms: [linux]
    command: "python3 scripts/docs/validate-source-of-truth.py"
    invariants:
      - "The authority map references every designated current Source-of-Truth document."
      - "Transient _incoming staging is not tracked."
      - "The specification index exactly matches tracked specs."
      - "Superseded master-design content cannot regain current authority silently."
    origin: "docs/architecture/source-of-truth-index.md"
    release_gate: true

  - id: PRE-RELEASE-EXHAUSTIVE-USER-TEST-CONTRACT
    name: Pre-release exhaustive user-test contract
    level: static
    cost: cheap
    domains: [release, e2e, documentation]
    triggers: [rc, release]
    platforms: [linux]
    command: "python3 -m pytest -q tests/test_exhaustive_user_test_release_contract.py tests/test_browser_feature_scenario_reconciliation_contract.py tests/test_full_user_e2e_contract.py"
    invariants:
      - "Browser Feature Scenario Reconciliation is mandatory before release and runs before candidate freeze."
      - "Full User E2E is mandatory before release and runs before candidate freeze."
      - "The final Browser and Full User E2E PASSes use the same HEAD; that HEAD is frozen only after both pass, then machine qualification/CI begins."
      - "Required exhaustive user-test documents remain executable ChatGPT-owned contracts."
      - "This CI/static contract check never counts as execution PASS for either exhaustive user test; release evidence must come from the active release Work Packet."
    origin: ".engineering/release.yaml"
    release_gate: true

  - id: BACKEND-PF11-PRODUCTION-WEBHOOK-FAIL-CLOSED
    name: Production Governance Webhook startup cannot bypass egress policy
    level: unit
    cost: cheap
    domains: [backend, runtime]
    triggers: [affected, pr]
    platforms: [linux]
    command: "python3 -m pytest -q tests/test_pf11_webhook_startup_fail_closed.py tests/test_pf11_governance_delivery_transport.py"
    invariants:
      - "Production and prod startup never install legacy HttpWebhookSender without a qualified SSRF and egress boundary."
      - "Default Governance Webhook sender remains unavailable, and genuine HTTP delivery is not claimed."
      - "Explicit isolated SMTP and Webhook mock test contracts remain intact."
    release_gate: true
